<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#020617;color:#e2e8f0}

.container{padding:140px 80px;max-width:600px;margin:auto}
h2{font-family:'Orbitron';font-size:48px;color:#38bdf8;margin-bottom:40px}
input,textarea{width:100%;padding:12px;margin-bottom:20px;background:#0f172a;border:1px solid rgba(56,189,248,.3);color:white;border-radius:6px}
button{padding:12px 30px;background:#38bdf8;border:none;color:#020617;font-weight:700;border-radius:6px;cursor:pointer}
button:hover{box-shadow:0 15px 40px rgba(56,189,248,.4)}
footer{text-align:center;padding:40px;margin-top:120px;border-top:1px solid rgba(255,255,255,.1)}

</head>
<body>
<div class="bg"></div>
<nav>

<footer>© 2026 Sariya.Tech</footer>
